[package]
name = "unigather"
version = "0.0.4"
description = "UniGather local material collection desktop application"
authors = ["UniGather"]
edition = "2021"

[lib]
name = "unigather_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
keyring = "3"
imap = "2.4.1"
mailparse = "0.16.1"
chrono = { version = "0.4", features = ["clock"] }
native-tls = "0.2"
sha2 = "0.10"
base64 = "0.22"
docx-rs = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
